name: Release PCM package

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 make_pcm_package.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
